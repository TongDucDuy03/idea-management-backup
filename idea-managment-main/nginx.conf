# Production template: install certificate and security snippet before nginx -t/reload.
server {
    listen 80;
    server_name idea.ducthangloi.com;
    return 308 https://idea.ducthangloi.com$request_uri;
}

server {
    listen 443 ssl;
    server_name idea.ducthangloi.com;
    ssl_certificate /etc/letsencrypt/live/idea.ducthangloi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idea.ducthangloi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    include /etc/nginx/snippets/idea-security-headers.conf;

    root /var/www/html/idea-management;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { expires -1; }
    location /static/ { expires 1y; try_files $uri =404; }

    # All uploads pass through authentication. Never serve this directory by alias.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
